# Mapowanie folderow zrodlowych na wspolne etykiety klasyfikatora.
#
# WAZNE: najpierw uruchom `python scripts/prepare_data.py --inspect`, zeby
# zobaczyc prawdziwe nazwy folderow i przyklady plikow w obu zbiorach,
# a nastepnie popraw ten plik:
#   * nazwy folderow OpenFungi-micro (ponizsze sa orientacyjne),
#   * group_regex dla DeFungi (id obrazu zrodlowego, z ktorego wyciety jest patch)
#     -- bez tego patche z jednego preparatu moga trafic do train i test naraz.
#
# Decyzja taksonomiczna (domyslna): Aspergillus niger (DeFungi H2) oraz
# Aspergillus sekcja Nigri (OpenFungi) sa scalone w jedna klase 'Aspergillus_niger'.
# To ten sam grzyb z dwoch zrodel -- scalenie lamie "skrot" rozpoznawania zrodla.
# Jesli wolisz trzymac je osobno, nadaj im rozne etykiety.

defungi:
  root: data/raw/defungi
  # przyklad regexu: jesli plik to "img12_patch003.png", to "^(.*?)_patch" da grupe "img12".
  # Ustaw po obejrzeniu --inspect. null = brak grupowania (kazdy patch osobno).
  group_regex: null
  classes:
    H1: Candida_albicans
    H2: Aspergillus_niger
    H3: Trichophyton_rubrum
    H5: Trichophyton_mentagrophytes
    H6: Epidermophyton_floccosum

openfungi:
  root: data/raw/openfungi/micro
  group_regex: null
  classes:        # ORIENTACYJNE -- zweryfikuj nazwy folderow przez --inspect
    Alternaria: Alternaria
    Aspergillus_Flavi: Aspergillus_flavi
    Aspergillus_Nigri: Aspergillus_niger     # scalone z DeFungi H2
    Fusarium: Fusarium
    Rhizopus: Rhizopus
    Penicillium: Penicillium
